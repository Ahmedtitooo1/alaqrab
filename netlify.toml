# =====================================================
# 🚀 AL-AQRAB EDUCATIONAL SYSTEM - NETLIFY CONFIG
# =====================================================

[build]
  # Build command for Vite + React
  command = "npm run build"
  
  # Output directory (Vite default)
  publish = "dist"
  
  # Environment variables (optional, can also set in Netlify UI)
  # Note: Sensitive keys should be set via Netlify Dashboard

[build.environment]
  NODE_VERSION = "18"

# =====================================================
# REDIRECTS & REWRITES
# =====================================================
# Handle React Router (SPA) - All routes go to index.html
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# =====================================================
# HEADERS FOR SECURITY & PERFORMANCE
# =====================================================
[[headers]]
  for = "/*"
  [headers.values]
    # Security Headers
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    X-XSS-Protection = "1; mode=block"
    Referrer-Policy = "strict-origin-when-cross-origin"
    
    # Cache Control
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/index.html"
  [headers.values]
    # Don't cache the main HTML file
    Cache-Control = "no-cache, no-store, must-revalidate"

[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.css"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

